name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend-fixture:
        description: 'Run disposable SurrealDB 3.2.4 acceptance (user-approved stable 3.2.x)'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the build version counts same-day commits
          # along the first-parent chain. A shallow clone silently undercounts
          # and would stamp a wrong version for the same commit SHA.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run test:unit
      # Read-only pending evidence report, NOT a release pass or deployment job.
      - run: npm run release:report
      # Existing Playwright configuration reads .env and reuses an app server;
      # its referenced parity suite is also ignored by Git. Do not run that
      # mutation suite here until REV-5.1 supplies an isolated Nitro fixture.
      # Browser/module acceptance remains a required, explicitly pending gate.

  backend-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.backend-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Fetch exact disposable DB binary (no fallback)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pb-backend-bin"
          curl --fail --location --max-time 120 \
            https://github.com/surrealdb/surrealdb/releases/download/v3.2.4/surreal-v3.2.4.linux-amd64.tgz \
            --output "$RUNNER_TEMP/pb-backend-bin/surreal.tgz"
          tar -xzf "$RUNNER_TEMP/pb-backend-bin/surreal.tgz" -C "$RUNNER_TEMP/pb-backend-bin"
      - name: SDK / transaction / streamed import / two-start acceptance
        run: npm run test:backend:integration -- --fixture --surreal-bin="$RUNNER_TEMP/pb-backend-bin/surreal"
