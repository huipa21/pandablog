# Include in http {} BEFORE pandablog.conf (e.g. 00-pandablog-log-format.conf).
# Use UTC for the proxy timezone. Duration is in seconds, not app timing in ms.
# No query, body, authorization/cookie headers, response cookies, referrer or UA.
# $uri is normalized and can contain sensitive path segments; restrict log access.
log_format pandablog_json escape=json
    '{"ts":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"duration_seconds":$request_time,"client_ip":"$remote_addr",'
    '"app_request_id":"$upstream_http_x_request_id","edge_request_id":"$request_id"}';
