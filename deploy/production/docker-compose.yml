services:
  app:
    image: ${PANDABLOG_IMAGE:-localhost/pandablog:latest}
    # Match the UID:GID that OWNS the bind-mounted ./app-storage and ./app-data
    # directories on the host. This is important to ensure that the container can read/write to these volumes
    # the deploy user is most likely 1000. Adjust if different.
    user: "1000:1000"
    pull_policy: never
    container_name: pandablog-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 3000
    volumes:
      - ./app-storage:/app/storage
      - ./app-data:/app/.data
      # GeoIP analytics database (optional). Place the DB-IP City Lite MMDB at
      # ./app-storage/geoip/dbip-city-lite.mmdb on the host. Because the whole
      # storage dir is bind-mounted, it will be visible inside the container at
      # /app/storage/geoip/dbip-city-lite.mmdb (the default GEOIP_DB_PATH).
      # The app creates ./app-storage/geoip/ automatically on boot; drop the
      # .mmdb there and restart this service. Until then the admin Analytics
      # page shows a "GeoIP database not loaded" notice and the world map is empty.
    networks:
      - nginx
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  nginx:
    external: true
